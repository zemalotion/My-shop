<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Hay Day Shop — Admin</title><link rel="stylesheet" href="/admin.css"></head><body>
<header><a href="/" class="brand">🐔 Hay Day Shop <span>ADMIN</span></a><a href="/">กลับหน้าร้าน ↗</a></header>
<main><section id="login" class="panel"><h1>🔐 เข้าสู่ระบบแอดมิน</h1><p>ใช้รหัสผ่านแอดมินที่ตั้งไว้ใน Environment Variables</p><form id="loginForm"><label>รหัสผ่านแอดมิน<input id="password" type="password" required autocomplete="current-password" placeholder="กรอกรหัสผ่าน"></label><button>เข้าสู่ระบบ</button><div id="loginError" class="error"></div></form></section>
<section id="dashboard" hidden><div class="heading"><div><h1>📦 จัดการออเดอร์</h1><p>อัปเดตสถานะและตรวจสอบรายการสั่งซื้อ</p></div><button id="refresh">↻ รีเฟรช</button></div><div class="stats"><div><small>ออเดอร์ทั้งหมด</small><b id="statAll">0</b></div><div><small>รอรับออเดอร์</small><b id="statPending">0</b></div><div><small>กำลังดำเนินการ</small><b id="statWorking">0</b></div><div><small>ส่งสำเร็จ</small><b id="statDone">0</b></div></div><div class="tools"><input id="search" placeholder="ค้นหาเลขออเดอร์ / ชื่อลูกค้า"><select id="statusFilter"><option value="">ทุกสถานะ</option><option>รอรับออเดอร์</option><option>กำลังจัดของ</option><option>กำลังส่ง</option><option>ส่งสำเร็จ</option><option>ยกเลิก</option></select><button id="logout" class="secondary">ออกจากระบบ</button></div><div id="orders" class="orders"><p>กำลังโหลด…</p></div></section></main><div id="toast" class="toast"></div><script src="/admin.js" defer></script></body></html>
